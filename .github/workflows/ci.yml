name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CAPTURE_ENABLED: "false"
      FLASK_DEBUG: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and route tests
        run: python -m unittest discover -v

      - name: Validate serialized model contract
        run: python evaluate_model.py --smoke --output reports/model-smoke.json

      - name: Compile Python sources
        run: python -m compileall -q application.py netmask flow tests

      - name: Validate browser JavaScript
        run: node --check static/js/application.js